# ─────────────────────────────────────────────────────────────────────────────
#  FaceID SaaS — docker-compose PRODUCCIÓN
#  Uso: docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
#  Variables requeridas en .env (ver .env.production.example):
#    DOMAIN, POSTGRES_PASSWORD, REDIS_PASSWORD, SECRET_KEY, API_WORKERS
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx (único punto de entrada a Internet) ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - admin
    restart: always
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── FastAPI (sin hot-reload, sin volumen de código) ──────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/faceid_saas
      DATABASE_SYNC_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/faceid_saas
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PUBLIC_URL: https://${DOMAIN}
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers ${API_WORKERS:-2}
      --no-access-log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - deepface_models:/root/.deepface
    restart: always
    networks:
      - internal
      - proxy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ── Admin Panel Next.js (producción) ─────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
    environment:
      NODE_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET: ${ADMIN_SECRET:-${SECRET_KEY}}
    restart: always
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── PostgreSQL + pgvector (red interna, sin puerto expuesto) ─────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: faceid_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faceid_saas"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Redis (contraseña, red interna, sin puerto expuesto) ─────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - internal

  # ── Certbot (renovación automática SSL cada 12h) ─────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Intenta renovar cada 12 horas; Let's Encrypt renueva cuando faltan <30 días
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: always

# ── Redes ────────────────────────────────────────────────────────────────────
networks:
  proxy:
    # Red que comparten nginx, api y admin
  internal:
    # Red aislada: solo db y redis. Sin acceso desde fuera.
    internal: true

# ── Volúmenes persistentes ───────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  deepface_models:
  certbot_webroot:
  letsencrypt:
