# FaceID SaaS — Nginx producción
# deploy.sh reemplaza TU_DOMINIO con el dominio real antes de desplegar

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=auth_zone:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=enroll_zone:10m  rate=20r/m;
    limit_req_zone $binary_remote_addr zone=liveness_zone:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m     rate=120r/m;
    limit_req_zone $binary_remote_addr zone=admin_zone:10m   rate=200r/m;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    server_tokens off;

    # HTTP → HTTPS redirect + ACME challenge
    server {
        listen 80;
        listen [::]:80;
        server_name TU_DOMINIO www.TU_DOMINIO;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS principal
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name TU_DOMINIO www.TU_DOMINIO;

        ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                       always;
        add_header X-Frame-Options           "SAMEORIGIN"                                    always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy        "camera=(self), microphone=()"                  always;

        client_max_body_size 6M;

        # /v1/faces/authenticate/*
        location ~ ^/v1/faces/authenticate/ {
            limit_req      zone=auth_zone burst=5 nodelay;
            limit_conn     conn_zone 8;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # /v1/faces/enroll/*
        location ~ ^/v1/faces/enroll/ {
            limit_req      zone=enroll_zone burst=8 nodelay;
            limit_conn     conn_zone 8;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # /v1/liveness/challenge
        location = /v1/liveness/challenge {
            limit_req      zone=liveness_zone burst=10 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # /v1/* API general
        location /v1/ {
            limit_req      zone=api_zone burst=30 nodelay;
            limit_conn     conn_zone 20;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # /health
        location = /health {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            access_log off;
        }

        # /widget (iframe embeddable)
        location = /widget {
            add_header X-Frame-Options          "" always;
            add_header Content-Security-Policy  "frame-ancestors *" always;
            add_header X-Content-Type-Options   "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Permissions-Policy       "camera=(self), microphone=()" always;
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # /api-docs, /api-redoc, /openapi.json (protegidos con basic auth)
        location ~ ^/(api-docs|api-redoc|openapi\.json) {
            auth_basic           "FaceID API Docs";
            auth_basic_user_file /etc/nginx/htpasswd;
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # /_next/static (assets del admin, cache agresivo)
        location /_next/static/ {
            proxy_pass         http://admin:3000;
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        # /portal, /login — rutas sin auth adicional de nginx
        location ~ ^/(portal|login)(/|$) {
            limit_req zone=admin_zone burst=30 nodelay;
            proxy_pass         http://admin:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Admin panel — auth manejada por Next.js middleware (cookie httpOnly)
        location / {
            limit_req  zone=admin_zone burst=50 nodelay;
            limit_conn conn_zone 10;
            proxy_pass         http://admin:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
