# docker-compose para VPS con IP sin dominio (cert autofirmado)
# Cuando tengas dominio: usa docker-compose.prod.yml

services:

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ip.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - admin
    restart: always
    networks:
      - proxy
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "5" }

  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/faceid_saas
      DATABASE_SYNC_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/faceid_saas
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --no-access-log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - deepface_models:/root/.deepface
    restart: always
    networks:
      - internal
      - proxy
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "10" }

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${SERVER_IP}
    environment:
      NODE_ENV: production
    restart: always
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: faceid_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faceid_saas"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - internal

networks:
  proxy:
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  deepface_models:
